/* Layout: barra lateral en escritorio, barra inferior en móvil; tarjetas solo para bloques que se editan */
:root{

}

  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --c1:#9cb44a; --c2:#e0b13f; --c3:#6fb3d2; --c4:#e07d5f; --c5:#a98bd0; --c6:#5fc2a6;
  --bg:#12150d; --surface:#1a1f13; --surface-2:#232a19; --ink:#e7ebdb; --ink-2:#a2aa92; --line:#333b26;
  --olive:#9cb44a; --olive-2:#b2c964; --on-olive:#12150d; --oil:#d8b24a; --oil-soft:#3a3115;
  --ok:#72c47e; --ok-soft:#1f3622; --warn:#e3a54a; --warn-soft:#3b2c12; --bad:#ec7b69; --bad-soft:#40211b; --info:#86b3e0; --info-soft:#1b2c3d;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}

button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13px}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--olive);color:var(--on-olive);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px}

.brand svg{flex:none}

textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--olive)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.p-normal{background:var(--ok-soft);color:var(--ok)}
.p-mas{background:var(--info-soft);color:var(--info)}
.p-menos{background:var(--warn-soft);color:var(--warn)}
.p-especial{background:var(--oil-soft);color:var(--oil)}
.p-ausente{background:var(--bad-soft);color:var(--bad)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-gris{background:var(--surface-2);color:var(--ink-2)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;min-width:0}

table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center}

.banner{border-radius:8px;padding:10px 12px;font-size:14px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.banner.info{background:var(--info-soft);color:var(--info)}

.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.wrow:last-child{border-bottom:0}
.wrow .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.wrow .ctl{grid-column:1/-1;display:grid;grid-template-columns:minmax(120px,1.3fr) 90px minmax(0,2fr);gap:8px;align-items:center}

@media (max-width:620px){ .wrow .ctl{grid-template-columns:1fr 84px} .wrow .ctl .nota{grid-column:1/-1} }
.mrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .grow{flex:1;min-width:0}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}

.savebar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:90vw;box-shadow:var(--shadow)}
/* Gráficas y saldos */
.chartw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 8px 4px}
.chartw svg{display:block}
.chartw text{fill:var(--ink-2);font-family:var(--f-body);font-size:11px}
.chartw .gl{stroke:var(--line);stroke-width:1}
.chartw .qs{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3;opacity:.6}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);padding:6px 4px 2px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.saldo{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.saldo>div{background:var(--surface);padding:12px 14px;min-width:0}
.saldo b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.saldo .resto{background:var(--olive);color:var(--on-olive)}
.saldo .resto{grid-column:1/-1}
@media (min-width:700px){.saldo{grid-template-columns:repeat(3,1fr)} .saldo .resto{grid-column:auto}}
.saldo .resto .lbl{color:inherit;opacity:.85}
.saldo .resto.neg{background:var(--bad);color:#fff}
.pago{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.pago:last-child{border-bottom:0}
.pago .grow{flex:1;min-width:0}
.pago .imp{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:90px;height:110px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal div{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:46px;padding:3px 5px;font-size:12px}
.cal div.h{background:none;border:0;min-height:0;text-align:center;font-weight:700;color:var(--ink-2)}
.cal div.x{background:none;border-color:transparent}
.cal div b{display:block;font-size:14px;color:var(--olive)}
.cal div.au b{color:var(--bad)}
.hint{font-size:13px;color:var(--ink-2)}
code.ph{background:var(--surface-2);border-radius:4px;padding:1px 5px;font-size:12px;cursor:pointer;border:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.li{transition:background .15s,border-color .15s}}
</style>

const fFechaL = s => s ? pD(s).toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" }) : "";

}
function perFl(per) { if (!per || per.k === "todo") return {}; return { desde: per.desde, hasta: per.hasta }; }
function perTxt(per) { return per && per.k !== "todo" ? `del ${fFechaL(per.desde)} al ${fFechaL(per.hasta)}` : "toda la campaña"; }
function cuentaDueno(did, fl = {}) {

  const rs = registros({ ...fl, duenos: [did], trabs: [] });
  const byT = {};
  rs.forEach(r => { if (r.tipo === "ausente") return; const t = byT[r.trabId] ??= { dias: new Set(), horas: 0 }; t.dias.add(r.fecha); t.horas += r.horas; });

  const mano = Object.entries(byT).map(([tid, v]) => ({ tid, nombre: nomT(tid), dias: v.dias.size, horas: v.horas, precio, importe: v.horas * precio })).sort(byName);

  const maquinas = Object.entries(mq).map(([mid, ud]) => { const mi = maqInfo(mid); const pr = +mi?.precio || 0; return { mid, nombre: mi?.nombre || mid, unidad: mi?.unidad || "día", ud, precio: pr, importe: ud * pr }; });
  const dias = ps.map(p => {
    const filas = Object.values(p.filas || {}); const pres = filas.filter(f => f.tipo !== "ausente");

  });

}

function calMes(ym, rs) {
  const [y, m] = ym.split("-").map(Number); const first = new Date(y, m - 1, 1); const n = new Date(y, m, 0).getDate();

  let cells = ["L", "M", "X", "J", "V", "S", "D"].map(d => `<div class="h">${d}</div>`).join("");
  for (let i = 0; i < off; i++) cells += `<div class="x"></div>`;
  for (let d = 1; d <= n; d++) {
    const k = ym + "-" + pad2(d); const xs = by[k] || [];
    const aus = xs.length && xs.every(x => x.tipo === "ausente"); const h = xs.reduce((s, x) => s + x.horas, 0);
    cells += `<div class="${aus ? "au" : ""}"><span class="muted">${d}</span>${xs.length ? `<b class="num">${aus ? "Falta" : fN(h)}</b>` : ""}</div>`;
  }
  return `<div class="card stack"><h3>${first.toLocaleDateString("es-ES", { month: "long", year: "numeric" })}</h3><div class="cal">${cells}</div></div>`;
}

/* Fotos del papel. Cada foto de doc.escaneos es una de estas:

    const out = [];
    for (const s of d.escaneos) {

after.ajustes = () => {
  const inp = $("#impCopia"); if (!inp) return;

    let j; try { j = JSON.parse(await f.text()); } catch (e) { return toast("Ese archivo no es una copia de CAMPAÑA CONTROL."); }
    if (j?.app !== "campana-control" || !j.S) return toast("Ese archivo no es una copia de CAMPAÑA CONTROL.");
    const n = COLS.reduce((a, c) => a + Object.keys(j.S[c] || {}).length, 0); const nf = Object.keys(j.fotos || {}).length;
    const incompleta = j.incompleta ? ` Atención: esta copia está incompleta, le ${+j.fotosFaltan === 1 ? "falta 1 foto" : "faltan " + (+j.fotosFaltan || "algunas") + " fotos"} de documentos.` : "";
    confirmar(`Se cargarán ${n} registros${nf ? ` y ${nf} fotos` : ""} de la copia del ${fFechaL((j.fecha || "").slice(0, 10)) || "archivo"}. Lo que tengas ahora en este dispositivo se sustituye por la copia.${incompleta}`, async () => {
      if (nf) toast("Cargando las fotos…");

      if (MODE === "local") { COLS.forEach(c => S[c] = S2[c] || {}); saveLocal(); limpiarFotos(); }
      else { for (const c of COLS) for (const [id, d] of Object.entries(S2[c] || {})) await put(c, id, d); }
      UI.inf = null; UI.draft = null; UI.dueVer = null; UI.trabVer = null; ensureCampSubs(); toast(faltan ? `Copia importada. ${faltan === 1 ? "1 foto no venía" : faltan + " fotos no venían"} en la copia.` : "Copia importada"); render();

/* ===================== Modal, pagos y toast ===================== */
let modalClose = null;
function openModal(html, onClose, wide) {
  $("#modal").innerHTML = `<div class="ov" data-ov="1"><div class="md ${wide ? "wide" : ""}" role="dialog" aria-modal="true">${html}</div></div>`;
  modalClose = onClose || null;
  setTimeout(() => $("#modal input:not([type=file]):not([disabled]), #modal button")?.focus?.(), 30);
}
function closeModal() { $("#modal").innerHTML = ""; const f = modalClose; modalClose = null; f?.(); if (renderPending) { renderPending = false; render(); } }
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modal").innerHTML) closeModal(); });
let tT = null;
function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(tT); tT = setTimeout(() => el.hidden = true, 2800); }

  const p = pagoId ? S.pagos[pagoId] : { fecha: hoy(), hora: ahoraHM(), forma: "efectivo" };
  const quien = tipo === "trabajador" ? nomT(personaId) : nomD(personaId);
  const r = tipo === "trabajador" ? resumenTrab(personaId) : cuentaDueno(personaId);
  const falta = r.pendiente + (pagoId ? +p.importe || 0 : 0);
  openModal(`<div class="mh"><div><div class="lbl">${tipo === "trabajador" ? "Entrega de dinero a" : "Pago de"}</div><h2>${esc(quien)}</h2></div><button class="iconbtn" data-act="cerrar" aria-label="Cerrar">${ic("x")}</button></div>
  <div class="stack" id="fpago">

   <div class="grid2"><label class="f"><span>Importe (€) *</span><input name="importe" inputmode="decimal" value="${p.importe != null ? fN(p.importe) : ""}" placeholder="Ej. 50"></label>
    <label class="f"><span>Forma de pago</span><select name="forma">${FORMAS.map(([k, n]) => `<option value="${k}" ${p.forma === k ? "selected" : ""}>${n}</option>`).join("")}</select></label>
    <label class="f"><span>Día</span><input type="date" name="fecha" value="${esc(p.fecha || hoy())}"></label><label class="f"><span>Hora</span><input type="time" name="hora" value="${esc(p.hora || "")}"></label></div>
   <label class="f"><span>Nota</span><input name="nota" value="${esc(p.nota || "")}" placeholder="${tipo === "trabajador" ? "Adelanto, liquidación final…" : "Primer pago, resto de la cuenta…"}"></label>
   <div class="row between">${pagoId ? `<button class="btn danger" data-act="borrarPago" data-id="${pagoId}">Borrar</button>` : "<span></span>"}<button class="btn pri" data-act="guardarPago" data-tipo="${tipo}" data-persona="${esc(personaId)}" data-id="${pagoId || ""}">Guardar</button></div>

async function guardarArchivo(nombre, blob) {
  if (DL) {
    try { await DL.save({ filename: nombre, data: blob }); toast("Archivo listo: " + nombre); }
    catch (e) { if (e?.code === "declined") return; if (e?.code === "rate_limited") toast("Espera un momento y vuelve a pulsar."); else toast("No se pudo descargar el archivo en esta vista."); }
    return;
  }
  if (!STANDALONE) { toast("No se pudo descargar el archivo en esta vista."); return; }
  // APK de Android (Capacitor): el WebView no descarga ni comparte archivos; se guarda en la caché de la app
  // y se abre la hoja de compartir de Android (Drive, WhatsApp, correo, «Guardar en Archivos»…)
  const cap = window.Capacitor?.isNativePlatform?.() ? window.Capacitor.Plugins : null;
  if (cap?.Filesystem && cap?.Share) {
    try {
      const data = (await blobToData(blob)).split(",")[1];
      const r = await cap.Filesystem.writeFile({ path: nombre, data, directory: "CACHE" });
      await cap.Share.share({ title: nombre, files: [r.uri], dialogTitle: "Guardar o enviar " + nombre });
    } catch (e) { if (!/cancel/i.test(e?.message || "")) toast("No se pudo guardar el archivo."); }
    return;
  }
  try {
    const file = new File([blob], nombre, { type: blob.type || "application/octet-stream" });
    // En el móvil, la hoja de compartir permite guardar en Archivos, enviar por WhatsApp, etc.
    if (/Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: nombre }); return; }
  } catch (e) { if (e?.name === "AbortError") return; }
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Archivo descargado: " + nombre);
}

    a.push(["Base", "", "", "", r2(k.base)], ["IVA " + (c.iva || 0) + "%", "", "", "", r2(k.iva)], ["TOTAL", "", "", "", r2(k.total)], ["Kilos", "", "", "", k.kilos || ""], []);
    a.push(["PAGOS DEL DUEÑO"], ["Día", "Hora", "Forma", "Nota", "Importe (€)"]); k.pagos.forEach(p => a.push([fFechaL(p.fecha), p.hora || "", formaTxt(p.forma), p.nota || "", r2(p.importe)]));
    a.push(["Total pagado", "", "", "", r2(k.pagado)], ["PENDIENTE", "", "", "", r2(k.pendiente)], []);
    a.push(["DETALLE POR DÍA"], ["Fecha", "Trabajadores", "Faltas", "Horas", "Maquinaria", "Kilos"]); k.dias.forEach(x => a.push([fFechaL(x.fecha), x.n, x.aus, r2(x.horas), x.maq, x.kilos ?? ""]));
    a.push([], ["DETALLE POR TRABAJADOR Y DÍA"], ["Fecha", "Trabajador", "Tipo", "Horas", "Nota"]);

  });
  await libro(wb, `Cuenta-${ks.length === 1 ? slug(ks[0].d.nombre) : "duenos"}-${slug(c.nombre)}.xlsx`);
}

async function xlsRegistro(fl) {
  if (!window.XLSX) return toast("No se pudo cargar el generador de Excel."); const c = camp();
  const ids = fl.trabs?.length ? fl.trabs : lista("trabajadores").map(t => t.id);
  const rs = ids.map(id => ({ id, ...resumenTrab(id, fl) })).filter(r => r.rs.length).sort((a, b) => nomT(a.id).localeCompare(nomT(b.id), "es"));
  if (!rs.length) return toast("No hay datos para esa selección");
  const dias = rangoFechas(fl.desde, fl.hasta);
  const a = [["Registro de horas", c.nombre, periodoTxt(fl), fl.duenos?.length ? fl.duenos.map(nomD).join(", ") : "Todos los dueños"], [], ["Trabajador", ...dias.map(d => fFechaL(d)), "Total horas", "Días", "Faltas", "Importe (€)"]];
  rs.forEach(r => { const by = {}; r.rs.forEach(x => { if (x.tipo === "ausente") { if (by[x.fecha] == null) by[x.fecha] = "F"; } else by[x.fecha] = (by[x.fecha] === "F" ? 0 : by[x.fecha] || 0) + x.horas; }); a.push([nomT(r.id), ...dias.map(d => by[d] === "F" ? "F" : by[d] ? r2(by[d]) : ""), r2(r.horas), r.dias, r.faltas, r2(r.importe)]); });
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, hoja(a, [26, ...dias.map(() => 10), 11, 6, 7, 11]), "Registro");
  const pd = [["Dueño", "Trabajador", "Días", "Horas"]]; const agg = {};
  registros(fl).forEach(r => { if (r.tipo === "ausente" || (fl.trabs?.length && !fl.trabs.includes(r.trabId))) return; const k = r.duenoId + "|" + r.trabId; const o = agg[k] ??= { d: r.duenoId, t: r.trabId, dias: 0, h: 0 }; o.dias++; o.h += r.horas; });
  Object.values(agg).sort((x, y) => nomD(x.d).localeCompare(nomD(y.d), "es") || nomT(x.t).localeCompare(nomT(y.t), "es")).forEach(o => pd.push([nomD(o.d), nomT(o.t), o.dias, r2(o.h)]));
  XLSX.utils.book_append_sheet(wb, hoja(pd, [26, 26, 7, 9]), "Por dueño");
  await libro(wb, `Registro-horas-${slug(c.nombre)}.xlsx`);
}

async function xlsGrafica(fl) {
  if (!window.XLSX) return toast("No se pudo cargar el generador de Excel."); const c = camp();
  const n = registros({ ...fl, trabs: fl.trabs }); if (!n.length) return toast("No hay datos para esa selección");
  const wb = XLSX.utils.book_new();
  const q = [["Gráfica de la campaña", c.nombre, periodoTxt(fl)], [], ["Quincena", "Dueño", "Días con parte", "Horas", "Mano de obra (€)"]];
  porQuincena(n, r => precioD(r.duenoId)).forEach(x => q.push([x.corto, nomD(x.duenoId), x.dias, r2(x.horas), r2(x.importe)]));
  XLSX.utils.book_append_sheet(wb, hoja(q, [16, 26, 14, 10, 16]), "Por quincena");
  const ds = duenosCamp().filter(d => n.some(r => r.duenoId === d.id)); const dias = rangoFechas(fl.desde, fl.hasta);
  const t = [["Día", ...ds.map(d => d.nombre), "Total horas"]];
  dias.forEach(d => { const v = ds.map(x => r2(n.filter(r => r.fecha === d && r.duenoId === x.id && r.tipo !== "ausente").reduce((s, r) => s + r.horas, 0))); t.push([fFechaL(d), ...v.map(x => x || ""), r2(v.reduce((a, b) => a + b, 0)) || ""]); });
  XLSX.utils.book_append_sheet(wb, hoja(t, [12, ...ds.map(() => 18), 12]), "Horas por día");
  await libro(wb, `Grafica-${slug(c.nombre)}.xlsx`);
}

/* ===================== Arranque ===================== */
async function boot() {
  render();
  const cl = window.claude;
  if (!cl?.use) {
    MODE = "local"; loadLocal(); render(); migrarFotos();
    navigator.storage?.persist?.().catch(() => {}); // pide al navegador que no borre los datos si falta espacio
    return;
  }
  const [db, as, dl, sm] = await Promise.all(["db", "assets", "downloads", "sample"].map(n => cl.use(n).catch(() => null)));
  ASSETS = as; DL = dl; SAMPLE = sm;
  if (sm) { try { const l = await sm.limits(); SAMPLE_IMG = !!l?.images; } catch (e) { SAMPLE_IMG = false; } }
  if (db) { DB = db; MODE = "nube"; subscribeGlobal(); }
  else { MODE = "local"; loadLocal(); migrarFotos(); }
  render();
}
boot();

<script>
// App instalable: funciona sin conexión una vez abierta (solo con https o en localhost).
// En el APK (Capacitor) no hace falta: los archivos ya están dentro de la app.
if ("serviceWorker" in navigator && !window.Capacitor && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(reg => {
    // Una app abierta durante días no recarga la página: al volver a ella se busca versión nueva (como mucho cada hora)
    let ultima = Date.now();
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - ultima > 36e5) { ultima = Date.now(); reg.update().catch(() => {}); } });
  }).catch(() => {}));
  // Cuando se activa una versión nueva, esta página sigue con la anterior: se avisa para recargar cuando el usuario quiera
  let habia = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!habia) { habia = true; return; }            // primera instalación: no hay nada que actualizar
    if (document.getElementById("avisoVersion")) return;
    const d = document.createElement("div"); d.id = "avisoVersion"; d.setAttribute("role", "status");
    d.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:70;background:var(--ink,#1c2113);color:var(--bg,#fff);padding:10px 14px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;max-width:92vw;font-weight:600";
    d.innerHTML = '<span>Hay una versión nueva de la app.</span><button type="button" class="btn sm pri">Actualizar</button>';
    d.querySelector("button").onclick = () => location.reload();   // si hay un parte sin guardar, el navegador lo avisa antes
    document.body.appendChild(d);
  });
}
</script>
