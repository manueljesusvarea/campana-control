# Compila el APK de Android en cada cambio de la rama main (gratis en GitHub Actions).
#
# Con los 4 secretos del repositorio (Settings → Secrets and variables → Actions) el APK se firma
# con la clave propia y se publica en «Releases»: así se puede actualizar sin desinstalar.
#   ANDROID_KEYSTORE_BASE64   la clave (.jks) en base64
#   ANDROID_KEYSTORE_PASSWORD contraseña del almacén
#   ANDROID_KEY_ALIAS         alias de la clave
#   ANDROID_KEY_PASSWORD      contraseña de la clave
# Sin secretos sale un APK de pruebas (debug), que solo se guarda como artefacto de la ejecución.
# ¡No instales nunca un APK de pruebas encima del firmado!
#
# Seguridad:
# - Solo se ejecuta con «push» a main o a mano. Nunca con pull requests, así que el código de terceros
#   (forks) no puede usar los secretos.
# - La compilación tiene permiso de solo lectura; la «Release» se crea en otro trabajo, que no ve la clave.
# - La clave solo llega al paso que la decodifica y al de Gradle, después de instalar dependencias,
#   y las dependencias se instalan sin ejecutar sus scripts.

name: APK de Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      firmado: ${{ steps.clave.outputs.hay }}
      version: ${{ steps.version.outputs.ver }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 necesita Java 21
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Generar www/index.html desde el código fuente
        run: python3 herramientas/construir_www.py

      - name: Instalar Capacitor (sin ejecutar scripts de paquetes)
        run: npm ci --ignore-scripts

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Versión
        id: version
        run: |
          VER=$(sed -n 's/.*const APP_VERSION = "\([^"]*\)".*/\1/p' claude-artifact/campana-control.html)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: ¿Hay clave de firma?
        id: clave
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: if [ -n "$KEYSTORE_B64" ]; then echo "hay=si" >> "$GITHUB_OUTPUT"; else echo "hay=no" >> "$GITHUB_OUTPUT"; fi

      - name: Compilar APK firmado
        if: steps.clave.outputs.hay == 'si'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VER: ${{ steps.version.outputs.ver }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/campana.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          rm -f "$ANDROID_KEYSTORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/CampanaControl-$VER.apk"

      - name: Compilar APK de pruebas (sin clave; NO instalar encima del firmado)
        if: steps.clave.outputs.hay != 'si'
        working-directory: android
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CampanaControl-$VER-pruebas.apk"

      - name: Guardar el APK en la ejecución
        uses: actions/upload-artifact@v5
        with:
          name: apk
          path: CampanaControl-*.apk
          if-no-files-found: error

  # Una «Release» por versión (v2.3.0…), compartida con el instalador de Windows. Solo con APK firmado.
  publicar:
    needs: apk
    if: needs.apk.outputs.firmado == 'si'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: apk
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VER: ${{ needs.apk.outputs.version }}
        run: |
          gh release view "v$VER" > /dev/null 2>&1 || gh release create "v$VER" --target "$GITHUB_SHA" --title "CAMPAÑA CONTROL $VER" \
            --notes "Android: descarga el archivo .apk en el móvil y ábrelo. Windows: descarga el .exe y ejecútalo (Más información → Ejecutar de todas formas)." || true
          gh release upload "v$VER" "CampanaControl-$VER.apk" --clobber
