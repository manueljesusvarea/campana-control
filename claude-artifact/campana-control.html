<title>CAMPAÑA CONTROL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: barra lateral en escritorio, barra inferior en móvil; tarjetas solo para bloques que se editan */
:root{
  --c1:#46561c; --c2:#c08a12; --c3:#2d6f8f; --c4:#a8492f; --c5:#6b4f8a; --c6:#2f7f6a;
  --bg:#f2f3ec; --surface:#ffffff; --surface-2:#e9ece0; --ink:#1c2113; --ink-2:#5b624f; --line:#d5d9c7;
  --olive:#46561c; --olive-2:#5f7428; --on-olive:#ffffff; --oil:#a87f12; --oil-soft:#f3e7c4;
  --ok:#2c7536; --ok-soft:#dcefdc; --warn:#9a5c00; --warn-soft:#f8e6c8; --bad:#a83526; --bad-soft:#f6dcd7; --info:#2d5a85; --info-soft:#dae6f2;
  --shadow:0 1px 2px rgba(30,40,10,.06),0 4px 14px rgba(30,40,10,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --c1:#9cb44a; --c2:#e0b13f; --c3:#6fb3d2; --c4:#e07d5f; --c5:#a98bd0; --c6:#5fc2a6;
  --bg:#12150d; --surface:#1a1f13; --surface-2:#232a19; --ink:#e7ebdb; --ink-2:#a2aa92; --line:#333b26;
  --olive:#9cb44a; --olive-2:#b2c964; --on-olive:#12150d; --oil:#d8b24a; --oil-soft:#3a3115;
  --ok:#72c47e; --ok-soft:#1f3622; --warn:#e3a54a; --warn-soft:#3b2c12; --bad:#ec7b69; --bad-soft:#40211b; --info:#86b3e0; --info-soft:#1b2c3d;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --c1:#9cb44a; --c2:#e0b13f; --c3:#6fb3d2; --c4:#e07d5f; --c5:#a98bd0; --c6:#5fc2a6;
  --bg:#12150d; --surface:#1a1f13; --surface-2:#232a19; --ink:#e7ebdb; --ink-2:#a2aa92; --line:#333b26;
  --olive:#9cb44a; --olive-2:#b2c964; --on-olive:#12150d; --oil:#d8b24a; --oil-soft:#3a3115;
  --ok:#72c47e; --ok-soft:#1f3622; --warn:#e3a54a; --warn-soft:#3b2c12; --bad:#ec7b69; --bad-soft:#40211b; --info:#86b3e0; --info-soft:#1b2c3d;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--olive)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);font-weight:600}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--olive);color:var(--on-olive);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.06em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.top .sp{flex:1}
.campsel{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:8px;padding:6px 8px;max-width:150px}
:root[data-theme="dark"] .campsel{background:rgba(0,0,0,.12)}
.campsel option{color:#1c2113;background:#fff}
.iconbtn{background:none;border:0;color:inherit;padding:6px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:rgba(255,255,255,.15)}
.sync{font-size:12px;opacity:.9;white-space:nowrap}
@media (max-width:560px){ .brand{font-size:18px;letter-spacing:.04em} .sync{display:none} .campsel{max-width:108px} .top{gap:8px} }
@media (max-width:360px){ .brand svg{display:none} }
.savebar .sbtxt{flex:1;min-width:0}

/* Estructura */
.shell{display:flex;min-height:calc(100vh - 56px)}
.side{display:none}
main{flex:1;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px;max-width:1100px;margin:0 auto;width:100%}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;color:var(--ink-2);text-decoration:none;font-size:11px;font-weight:600}
.tabs a[aria-current="page"]{color:var(--olive)}
.tabs a[aria-current="page"] svg{stroke:var(--olive)}
@media (min-width:900px){
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:2px;width:210px;flex:none;padding:18px 10px;border-right:1px solid var(--line);position:sticky;top:56px;height:calc(100vh - 56px)}
  .side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:600}
  .side a:hover{background:var(--surface-2)}
  .side a[aria-current="page"]{background:var(--olive);color:var(--on-olive)}
  .side a[aria-current="page"] svg{stroke:var(--on-olive)}
  main{padding-bottom:40px}
}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side svg.i{width:19px;height:19px}

/* Componentes */
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px;text-decoration:none}
.btn:hover{border-color:var(--olive-2)}
.btn.pri{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.btn.pri:hover{background:var(--olive-2)}
.btn.oil{background:var(--oil);border-color:var(--oil);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg.i{width:18px;height:18px}
:focus-visible{outline:2px solid var(--oil);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 160px}
label.f>span{font-size:13px;color:var(--ink-2);font-weight:600}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--olive)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.p-normal{background:var(--ok-soft);color:var(--ok)}
.p-mas{background:var(--info-soft);color:var(--info)}
.p-menos{background:var(--warn-soft);color:var(--warn)}
.p-especial{background:var(--oil-soft);color:var(--oil)}
.p-ausente{background:var(--bad-soft);color:var(--bad)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-gris{background:var(--surface-2);color:var(--ink-2)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--on-olive)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);background:var(--surface-2);font-weight:700}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--surface-2)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);min-width:0;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:17px}
.banner{border-radius:8px;padding:10px 12px;font-size:14px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.banner.info{background:var(--info-soft);color:var(--info)}

/* Parte diario */
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.wrow:last-child{border-bottom:0}
.wrow .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.wrow .ctl{grid-column:1/-1;display:grid;grid-template-columns:minmax(120px,1.3fr) 90px minmax(0,2fr);gap:8px;align-items:center}
.wrow.aus{background:color-mix(in srgb,var(--bad-soft) 45%,transparent)}
@media (max-width:620px){ .wrow .ctl{grid-template-columns:1fr 84px} .wrow .ctl .nota{grid-column:1/-1} }
.mrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .grow{flex:1;min-width:0}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step button{width:40px;height:40px;border:0;background:var(--surface-2);font-size:20px;font-weight:700;cursor:pointer}
.step input{width:52px;border:0;border-radius:0;text-align:center;min-height:40px;padding:0}
.savebar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (min-width:900px){.savebar{bottom:12px}}
.dirty{color:var(--warn);font-weight:700;font-size:13px}

/* Modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(15,20,8,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.ov{align-items:center;padding:24px}}
.md{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.md{border-radius:14px}}
.md.wide{max-width:900px}
.md .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:90vw;box-shadow:var(--shadow)}
/* Gráficas y saldos */
.chartw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 8px 4px}
.chartw svg{display:block}
.chartw text{fill:var(--ink-2);font-family:var(--f-body);font-size:11px}
.chartw .gl{stroke:var(--line);stroke-width:1}
.chartw .qs{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3;opacity:.6}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);padding:6px 4px 2px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.saldo{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.saldo>div{background:var(--surface);padding:12px 14px;min-width:0}
.saldo b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.saldo .resto{background:var(--olive);color:var(--on-olive)}
.saldo .resto{grid-column:1/-1}
@media (min-width:700px){.saldo{grid-template-columns:repeat(3,1fr)} .saldo .resto{grid-column:auto}}
.saldo .resto .lbl{color:inherit;opacity:.85}
.saldo .resto.neg{background:var(--bad);color:#fff}
.pago{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.pago:last-child{border-bottom:0}
.pago .grow{flex:1;min-width:0}
.pago .imp{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:90px;height:110px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal div{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:46px;padding:3px 5px;font-size:12px}
.cal div.h{background:none;border:0;min-height:0;text-align:center;font-weight:700;color:var(--ink-2)}
.cal div.x{background:none;border-color:transparent}
.cal div b{display:block;font-size:14px;color:var(--olive)}
.cal div.au b{color:var(--bad)}
.hint{font-size:13px;color:var(--ink-2)}
code.ph{background:var(--surface-2);border-radius:4px;padding:1px 5px;font-size:12px;cursor:pointer;border:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.li{transition:background .15s,border-color .15s}}
</style>

<header class="top">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 27C12 22 18 14 27 5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/><ellipse cx="12" cy="13" rx="4.2" ry="6.2" transform="rotate(-35 12 13)" fill="currentColor" opacity=".9"/><ellipse cx="21" cy="19" rx="3.6" ry="5.4" transform="rotate(-35 21 19)" fill="currentColor" opacity=".65"/></svg>
    CAMPAÑA CONTROL
  </div>
  <div class="sp"></div>
  <span class="sync" id="sync"></span>
  <select class="campsel" id="campsel" aria-label="Campaña activa"></select>
  <a class="iconbtn" href="#ajustes" aria-label="Ajustes" title="Ajustes"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Secciones"></nav>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Secciones"></nav>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script>
"use strict";
/* ===================== Utilidades ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = (p = "") => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad2 = n => String(n).padStart(2, "0");
const isoD = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
const hoy = () => isoD(new Date());
const pD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = pD(s); d.setDate(d.getDate() + n); return isoD(d); };
const fFecha = s => s ? pD(s).toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" }) : "";
const fFechaL = s => s ? pD(s).toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
const fN = (n, d = 2) => (+n || 0).toLocaleString("es-ES", { maximumFractionDigits: d });
const fH = n => fN(n) + " h";
const fE = n => (+n || 0).toLocaleString("es-ES", { style: "currency", currency: "EUR" });
const num = v => {
  if (v === "" || v == null) return null; let t = String(v).trim().replace(/\s|€/g, "");
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, "").replace(",", "."); // 2.350 o 1.234,50
  else t = t.replace(",", ".");
  const n = parseFloat(t); return isNaN(n) ? null : n;
};
const ahoraHM = () => { const d = new Date(); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); };
const byName = (a, b) => (a.nombre || "").localeCompare(b.nombre || "", "es");
const clone = o => JSON.parse(JSON.stringify(o ?? {}));
function hhmmAdd(hhmm, horas) { const [h, m] = (hhmm || "08:00").split(":").map(Number); const t = h * 60 + m + Math.round((+horas || 0) * 60); return pad2(Math.floor(t / 60) % 24) + ":" + pad2(t % 60); }

function perFl(per) { if (!per || per.k === "todo") return {}; return { desde: per.desde, hasta: per.hasta }; }

function cuentaDueno(did, fl = {}) {

  rs.forEach(r => { if (r.tipo === "ausente") return; const t = byT[r.trabId] ??= { dias: new Set(), horas: 0 }; t.dias.add(r.fecha); t.horas += r.horas; });

  });

function calMes(ym, rs) {
  const [y, m] = ym.split("-").map(Number); const first = new Date(y, m - 1, 1); const n = new Date(y, m, 0).getDate();

  let cells = ["L", "M", "X", "J", "V", "S", "D"].map(d => `<div class="h">${d}</div>`).join("");
  for (let i = 0; i < off; i++) cells += `<div class="x"></div>`;
  for (let d = 1; d <= n; d++) {
    const k = ym + "-" + pad2(d); const xs = by[k] || [];
    const aus = xs.length && xs.every(x => x.tipo === "ausente"); const h = xs.reduce((s, x) => s + x.horas, 0);
    cells += `<div class="${aus ? "au" : ""}"><span class="muted">${d}</span>${xs.length ? `<b class="num">${aus ? "Falta" : fN(h)}</b>` : ""}</div>`;
  }
  return `<div class="card stack"><h3>${first.toLocaleDateString("es-ES", { month: "long", year: "numeric" })}</h3><div class="cal">${cells}</div></div>`;
}

/* Fotos del papel. Cada foto de doc.escaneos es una de estas:

    const incompleta = j.incompleta ? ` Atención: esta copia está incompleta, le ${+j.fotosFaltan === 1 ? "falta 1 foto" : "faltan " + (+j.fotosFaltan || "algunas") + " fotos"} de documentos.` : "";

/* ===================== Modal, pagos y toast ===================== */
let modalClose = null;

function closeModal() { $("#modal").innerHTML = ""; const f = modalClose; modalClose = null; f?.(); if (renderPending) { renderPending = false; render(); } }
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modal").innerHTML) closeModal(); });

async function guardarArchivo(nombre, blob) {
  if (DL) {
    try { await DL.save({ filename: nombre, data: blob }); toast("Archivo listo: " + nombre); }
    catch (e) { if (e?.code === "declined") return; if (e?.code === "rate_limited") toast("Espera un momento y vuelve a pulsar."); else toast("No se pudo descargar el archivo en esta vista."); }
    return;
  }
  if (!STANDALONE) { toast("No se pudo descargar el archivo en esta vista."); return; }
  // APK de Android (Capacitor): el WebView no descarga ni comparte archivos; se guarda en la caché de la app
  // y se abre la hoja de compartir de Android (Drive, WhatsApp, correo, «Guardar en Archivos»…)
  const cap = window.Capacitor?.isNativePlatform?.() ? window.Capacitor.Plugins : null;
  if (cap?.Filesystem && cap?.Share) {
    try {
      const data = (await blobToData(blob)).split(",")[1];
      const r = await cap.Filesystem.writeFile({ path: nombre, data, directory: "CACHE" });
      await cap.Share.share({ title: nombre, files: [r.uri], dialogTitle: "Guardar o enviar " + nombre });
    } catch (e) { if (!/cancel/i.test(e?.message || "")) toast("No se pudo guardar el archivo."); }
    return;
  }
  try {
    const file = new File([blob], nombre, { type: blob.type || "application/octet-stream" });
    // En el móvil, la hoja de compartir permite guardar en Archivos, enviar por WhatsApp, etc.
    if (/Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: nombre }); return; }
  } catch (e) { if (e?.name === "AbortError") return; }
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Archivo descargado: " + nombre);
}

async function nImpLeer(file) {
  const w = NUBE.imp = { nombre: file.name, destino: NUBE.c?.campana_id || nGestionables()[0]?.campana_id };
  try {
    const texto = await file.text(); let j; try { j = JSON.parse(texto); } catch (e) { throw new Error("El archivo no es una copia de Campaña Control (no es JSON válido)."); }
    w.texto = texto; w.fecha = j.fecha; w.version = j.version;
    if (j.tipo === "copia-campana-3" && j.datos) {
      const h = await sha256Hex(new TextEncoder().encode(JSON.stringify(j.datos)));
      if (h !== j.integridad?.sha256) throw new Error("La copia está dañada o se ha modificado: su huella no coincide. No se importa.");
      for (const f of j.fotos || []) if (f.sha256 && await sha256Hex(await dataABlob(f.data).arrayBuffer()) !== f.sha256) throw new Error("Una foto de la copia está dañada (huella distinta). No se importa.");
      let sello = false; try { sello = !!j.sello && (await NUBE.sb.rpc("verificar_sello", { p_datos: j.datos, p_sello: j.sello })).data === true; } catch (e) { }
      Object.assign(w, { tipo: "3.0", integridad: true, sello, miembros: j.datos.miembros || [], datos: j.datos, campanaNombre: j.campana, fotos: (j.fotos || []).map(f => ({ documento: f.documento, data: f.data, sha256: f.sha256 })),
        avisos: (j.integridad.fotos || 0) > (j.fotos || []).length ? [`La copia se hizo sin ${(j.integridad.fotos || 0) - (j.fotos || []).length} foto(s).`] : [] });
      nImpTotales(j.integridad?.totales);
    } else if (j.app === "campana-control" && j.S && j.S.campanas) {
      const fuentes = Object.entries(j.S.campanas).map(([id, c]) => ({ id, nombre: c.nombre || id, partes: Object.values(j.S.partes || {}).filter(p => p.campanaId === id).length }));
      if (!fuentes.length) throw new Error("La copia no tiene ninguna campaña.");
      Object.assign(w, { tipo: "2.3.0", S: j.S, j, fuentes, fuente: (fuentes.find(f => f.id === j.S.ajustes?.general?.campanaActiva) || fuentes.sort((a, b) => b.partes - a.partes)[0]).id });

function nImpTotales(ref) {

      for (const [id, v] of Object.entries(ref[k1] || {})) for (const c of campos) if (Math.abs((w.totales[k1][id]?.[c] ?? 0) - v[c]) > 0.005) dif.push(`${v.nombre}: ${c} ${v[c]} en la copia y ${w.totales[k1][id]?.[c] ?? 0} al convertir`);
  }

/* ---------- Consulta sin conexión: caché privada en este dispositivo ----------
   Tras cada carga correcta se guarda una copia de lo que el usuario puede ver (solo lo suyo), cifrada con AES-GCM y una
   clave no exportable creada en este navegador (IndexedDB). Sin conexión se enseña esa copia con un aviso de la fecha y
   no se deja guardar nada. Caduca a los 7 días. Al cerrar sesión se borran todas las copias del dispositivo.
   Límite honesto: protege frente a quien copie los archivos del navegador, no frente a quien use el dispositivo con la
   sesión abierta; y una cuenta bloqueada mientras el móvil está sin cobertura sigue viendo su copia hasta que vuelva la
   conexión (como mucho 7 días). */
const CACHE_DIAS = 7, CACHE_DB = "campana-control-nube";
function cacheDb() { return new Promise((res, rej) => { const r = indexedDB.open(CACHE_DB, 1); r.onupgradeneeded = () => { r.result.createObjectStore("claves"); r.result.createObjectStore("datos"); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function cacheTx(st, modo, fn) { const db = await cacheDb(); try { return await new Promise((res, rej) => { const t = db.transaction(st, modo), s = t.objectStore(st), q = fn(s); t.oncomplete = () => res(q?.result); t.onerror = () => rej(t.error); }); } finally { db.close(); } }
async function cacheClave(uid) {
  let k = await cacheTx("claves", "readonly", s => s.get(uid));
  if (!k) { k = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]); await cacheTx("claves", "readwrite", s => s.put(k, uid)); }
  return k;
}
async function guardarCacheNube() {
  try {
    if (!window.indexedDB || !crypto?.subtle || !NUBE.sesion || !NUBE.d) return; const uid = NUBE.sesion.user.id;
    const datos = { t: Date.now(), perfil: NUBE.perfil, superadmin: NUBE.superadmin, campanas: NUBE.campanas, c: NUBE.c, roles: NUBE.roles, permisos: NUBE.permisos, d: NUBE.d };
    const iv = crypto.getRandomValues(new Uint8Array(12)), k = await cacheClave(uid);
    const cif = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, new TextEncoder().encode(JSON.stringify(datos)));
    await cacheTx("datos", "readwrite", s => s.put({ iv, cif, t: datos.t }, uid));
  } catch (e) { }
}
async function leerCacheNube(uid) {
  try {
    const r = await cacheTx("datos", "readonly", s => s.get(uid)); if (!r) return null;
    if (Date.now() - r.t > CACHE_DIAS * 864e5) { await borrarCacheNube(); return null; }
    const k = await cacheTx("claves", "readonly", s => s.get(uid)); if (!k) return null;
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: r.iv }, k, r.cif)));
  } catch (e) { return null; }
}
async function borrarCacheNube() { try { if (window.indexedDB) await new Promise(r => { const q = indexedDB.deleteDatabase(CACHE_DB); q.onsuccess = q.onerror = q.onblocked = () => r(); }); } catch (e) { } }
const esFalloRed = e => !navigator.onLine || /Failed to fetch|NetworkError|Load failed|fetch/i.test(String(e?.message || e));
async function nubeDesdeCache() {
  const c = NUBE.sesion && await leerCacheNube(NUBE.sesion.user.id); if (!c) return false;
  Object.assign(NUBE, { perfil: c.perfil, superadmin: c.superadmin, campanas: c.campanas, c: c.c, roles: c.roles, permisos: c.permisos, d: c.d, desdeCache: c.t });

/* ---------- Administrar la campaña: configuración, precios, maquinaria, archivar y eliminar (000018) ----------
   Lo ven y lo usan quien creó la campaña y el superadministrador (aunque no sea miembro). La base de datos lo comprueba
   igualmente (cc_priv.gestiona; archivada = solo lectura; eliminar solo el superadministrador). Un cambio de precio o de
   horas vuelve a calcular las jornadas igual que la 2.3.0 (el importe no se guarda en cada jornada): antes de guardar se
   enseña cuánto cambian los totales; los pagos y entregas registrados no cambian nunca. Todo queda en la auditoría. */
const EMP_CAMPOS = [["nombre", "Nombre o razón social"], ["nif", "NIF / CIF"], ["direccion", "Dirección"], ["telefono", "Teléfono"], ["encargado", "Encargado de la cuadrilla"], ["iban", "IBAN para las cuentas"]];
function nImpacto(cambios) {
  const d = NUBE.d, en = (o, k) => o && Object.prototype.hasOwnProperty.call(o, k);
  const dx = { ...d, campana: { ...d.campana, ...(cambios.campana || {}) }, eco: { ...(d.eco || {}), ...(cambios.eco || {}) },
    trab: d.trab.map(t => en(cambios.trab, t.id) ? { ...t, precio_hora_cent: cambios.trab[t.id] } : t),
    duenos: d.duenos.map(x => en(cambios.dueno, x.id) ? { ...x, precio_hora_cent: cambios.dueno[x.id] } : x),
    maq: d.maq.map(m => en(cambios.maq, m.id) ? { ...m, precio_cent: cambios.maq[m.id] } : m) };
  const tot = dd => conS(snConsulta(dd), () => ({ trab: dd.trab.reduce((s, t) => s + resumenTrab(t.id).importe, 0), duenos: dd.duenos.reduce((s, x) => s + cuentaDueno(x.id).total, 0) }));
  const a = tot(d), b = tot(dx);
  return { a, b, jornadas: d.filas.filter(f => f.tipo !== "ausente").length, pagos: d.pagos.length, cambia: Math.abs(a.trab - b.trab) > 0.004 || Math.abs(a.duenos - b.duenos) > 0.004 };
}

// Parte: el borrador se guarda en memoria para que una recarga en tiempo real no borre lo que se está escribiendo
function nBorrador() {
  const d = NUBE.d, b = NUBE.borrador;

    if (!b.cargado) { const p = d.partes.find(x => x.dueno_id === b.dueno && x.fecha === b.fecha); Object.assign(b, nDesdeParte(p, b.dueno, b.fecha)); }
    return b;

  return NUBE.borrador = d.duenos.length ? nDesdeParte(d.partes.find(x => x.dueno_id === d.duenos[0].id && x.fecha === hoy()), d.duenos[0].id, hoy()) : null;

function nDesdeParte(p, dueno, fecha) {
  const d = NUBE.d, filas = {};

  d.trab.filter(t => t.activo).forEach(t => filas[t.id] ??= { si: !p, tipo: "normal", horas: null, nota: "" });
  const maq = {}; if (p) d.pmaq.filter(m => m.parte_id === p.id).forEach(m => maq[m.maquina_id] = m.cantidad);
  return { dueno, fecha, version: p?.version ?? null, kilos: p?.kilos ?? "", notas: p?.notas || "", filas, maq, cargado: true, sucio: false };

nAfter.parte = () => {
  const box = $("#fnparte"); if (!box) return;
  const cambio = async e => {
    const el = e.target, k = el.dataset.np; if (!k) return; const b = NUBE.borrador;
    if (k === "dueno" || k === "fecha") {
      if (b.sucio && !confirm("Hay cambios sin guardar en este parte. ¿Descartarlos?")) { el.value = b[k]; return; }
      NUBE.borrador = { dueno: k === "dueno" ? el.value : b.dueno, fecha: k === "fecha" ? (el.value || b.fecha) : b.fecha }; render(); return;
    }
    const f = b.filas[el.dataset.id];
    if (k === "si") f.si = el.checked;
    if (k === "tipo") { f.tipo = el.value; f.horas = el.value === "mas" ? nHd() + 1 : el.value === "menos" ? Math.max(0, nHd() - 1) : el.value === "especial" ? nHd() : null; if (el.value !== "ausente") f.si = true; }
    if (k === "horas") f.horas = num(el.value);
    if (k === "nota") f.nota = el.value;
    if (k === "maq") b.maq[el.dataset.id] = Math.max(0, parseInt(el.value) || 0);
    if (k === "kilos") b.kilos = el.value;
    if (k === "notas") b.notas = el.value;
    b.sucio = true; const sb = $(".savebar span", box); if (sb) { sb.className = "dirty"; sb.textContent = "Cambios sin guardar"; }
    if (k === "tipo" || k === "si") render();
  };
  box.addEventListener("change", cambio); box.addEventListener("input", e => { if (["horas", "nota", "kilos", "notas"].includes(e.target.dataset.np)) cambio(e); });
};

/* ===================== Arranque ===================== */
async function boot() {
  render();
  if (nubeDisponible() && !prefLocal()) { try { await nubeIniciar(); return; } catch (e) { console.error(e); MODE = "cargando"; } }
  const cl = window.claude;
  if (!cl?.use) {
    MODE = "local"; loadLocal(); render(); migrarFotos();
    navigator.storage?.persist?.().catch(() => {}); // pide al navegador que no borre los datos si falta espacio
    return;
  }
  const [db, as, dl, sm] = await Promise.all(["db", "assets", "downloads", "sample"].map(n => cl.use(n).catch(() => null)));
  ASSETS = as; DL = dl; SAMPLE = sm;
  if (sm) { try { const l = await sm.limits(); SAMPLE_IMG = !!l?.images; } catch (e) { SAMPLE_IMG = false; } }
  if (db) { DB = db; MODE = "nube"; subscribeGlobal(); }
  else { MODE = "local"; loadLocal(); migrarFotos(); }
  render();
}
boot();
